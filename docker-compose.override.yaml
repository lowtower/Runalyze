services:

  phpmyadmin:
    image: docker.io/phpmyadmin/phpmyadmin:5.2
    container_name: runalyze43-phpmyadmin
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: runalyze
      PMA_PASSWORD: runalyze
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PMA_UI_PORT:-8081}:80"

  frontend:
    image: docker.io/library/node:22
    container_name: runalyze43-frontend
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - node-modules:/var/www/html/node_modules
    mem_limit: 2g
    mem_reservation: 1g
    stop_grace_period: 60s
    # Frontend build: plain npm + esbuild (see scripts/build-js.js and
    # scripts/build-styles.js). Bower is gone; the vendor files in
    # public/vendor are committed to the repository now.
    command: ["bash", "-lc", "set -e && npm install && npm run build && echo 'Build complete'"]
    stdin_open: true
    tty: true

###> symfony/mailer ###
  mailhog:
    image: docker.io/mailhog/mailhog:v1.0.1
    container_name: runalyze43-mailhog
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_UI_PORT:-8025}:8025"
    restart: unless-stopped
###< symfony/mailer ###

volumes:
  node-modules:
