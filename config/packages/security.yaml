security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Runalyze\Bundle\CoreBundle\Entity\Account:
            id: app.sha256salted_encoder

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        runalyzeuser:
            entity:
                class: Runalyze\Bundle\CoreBundle\Entity\Account
    firewalls:
        # The first firewall whose pattern matches is used, so the most specific ones come first
        # and the firewall without a pattern ("default") has to be the last one.
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        setup:
            pattern: ^/(update|install)
            security: false
        externalapi:
            pattern:  ^/api
            http_basic: true
            provider:  runalyzeuser
            stateless: true
            user_checker: Runalyze\Bundle\CoreBundle\Services\AccountChecker
        default:
            entry_point: form_login
            http_basic: ~
            provider: runalyzeuser
            switch_user: { role: ROLE_ADMIN, parameter: _switch_user }
            user_checker: Runalyze\Bundle\CoreBundle\Services\AccountChecker
            logout:
                path: /logout
                target: /
            stateless: false
            form_login:
                login_path: login
                check_path: login_check
                enable_csrf: true
                use_referer: true
            remember_me:
                secret: '%app.secret%'
                lifetime: 604800
                path: /
    role_hierarchy:
        ROLE_ADMIN: ROLE_USER

            # Activate different ways to authenticate:
            # https://symfony.com/doc/current/security.html#the-firewall

            # https://symfony.com/doc/current/security/impersonating_user.html
            # switch_user: true

    # Note: Only the *first* matching rule is applied
    access_control:
        - { path: ^/api, roles: ROLE_USER }
        # - { path: ^/admin, roles: ROLE_ADMIN }
        # - { path: ^/profile, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
