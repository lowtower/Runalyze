# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    RUNALYZE_VERSION: '%env(string:RUNALYZE_VERSION)%'
    RUNALYZE_DATE: '%env(string:RUNALYZE_DATE)%'

    locale: '%env(string:LOCALE)%'
    app.locale: '%env(string:LOCALE)%'
    app.secret: '%env(string:APP_SECRET)%'
    app.update_disabled: '%env(string:UPDATE_DISABLED)%'
    app.user_can_register: '%env(bool:USER_CAN_REGISTER)%'
    app.user_disable_account_activation: '%env(bool:USER_DISABLE_ACCOUNT_ACTIVATION)%'
    app.maintenance: '%env(bool:MAINTENANCE)%'
    app.backup_storage_period: '%env(int:BACKUP_STORAGE_PERIOD)%'
    app.poster_storage_period: '%env(int:POSTER_STORAGE_PERIOD)%'
    app.feedback_mail: '%env(string:FEEDBACK_MAIL)%'

    app.database_host: '%env(string:DATABASE_HOST)%'
    app.database_prefix: '%env(string:DATABASE_PREFIX)%'
    app.database_port: '%env(int:DATABASE_PORT)%'
    app.database_name: '%env(string:DATABASE_NAME)%'
    app.database_user: '%env(string:DATABASE_USER)%'
    app.database_password: '%env(string:DATABASE_PASSWORD)%'

    app.mail_sender: '%env(MAIL_SENDER)%'
    app.mail_name: '%env(MAIL_NAME)%'
    app.mail_localdomain: '%env(MAIL_LOCALDOMAIN)%'
    app.smtp_host: '%env(string:SMTP_HOST)%'
    app.smtp_port: '%env(int:SMTP_PORT)%'
    app.smtp_security: '%env(string:SMTP_SECURITY)%'
    app.smtp_username: '%env(string:SMTP_USERNAME)%'
    app.smtp_password: '%env(string:SMTP_PASSWORD)%'

    app.garmin_api_key: '%env(string:GARMIN_API_KEY)%'
    app.weather_max_age_for_current_conditions: '%env(int:WEATHER_MAX_AGE_FOR_CURRENT_CONDITIONS)%'
    app.weather_proxy: '%env(string:WEATHER_PROXY)%'
    app.openweathermap_api_key: '%env(string:OPENWEATHERMAP_API_KEY)%'
    app.meteostatnet_api_key: '%env(string:METEOSTAT_API_KEY)%'
    app.darksky_api_key: '%env(string:DARKSKY_API_KEY)%'
    app.nokia_here_appid: '%env(string:NOKIA_HERE_APPID)%'
    app.nokia_here_token: '%env(string:NOKIA_HERE_TOKEN)%'
    app.thunderforest_api_key: '%env(string:THUNDERFOREST_API_KEY)%'
    app.mapbox_api_key: '%env(string:MAPBOX_API_KEY)%'
    app.geonames_username: '%env(string:GEONAMES_USERNAME)%'
    app.osm_overpass_url: '%env(string:OSM_OVERPASS_URL)%'
    app.osm_overpass_proxy: '%env(string:OSM_OVERPASS_PROXY)%'

    app.perl_path: '%env(string:PERL_PATH)%'
    app.python3_path: '%env(string:PYTHON3_PATH)%'
    app.rsvg_path: '%env(string:RSVG_PATH)%'
    app.inkscape_path: '%env(string:INKSCAPE_PATH)%'
    app.ttbin_path: '%env(string:TTBIN_PATH)%'
    app.sqlite_mod_spatialite: '%env(string:SQLITE_MOD_SPATIALITE)%'

    app.data_directory: '%kernel.project_dir%/data'

    redis.default.dsn: '%env(string:REDIS_URL)%'
    router.request_context.host: localhost
    router.request_context.scheme: http
    router.request_context.base_url: ''
    session.handler_id: session.handler.native_file

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    #App\:
    #    resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    Runalyze\Bundle\CoreBundle\Controller\:
        resource: '../src/CoreBundle/Controller'
        tags: ['controller.service_arguments']

    Runalyze\Bundle\GlossaryBundle\Controller\:
        resource: '../vendor/runalyze/glossary/Controller'
        tags: ['controller.service_arguments']

    Runalyze\Bundle\CoreBundle\Command\:
        resource: '../src/CoreBundle/Command'
        tags: ['console.command']

    Runalyze\Bundle\CoreBundle\Command\CleanupBackupCommand:
        arguments:
            $parameterBag: '@parameter_bag'
            $filesystem: '@filesystem'
        tags: ['console.command']

    Runalyze\Bundle\CoreBundle\Command\MailingCommand:
        arguments:
            $mailer: '@Runalyze\Bundle\CoreBundle\Services\AccountMailer'
        tags: ['console.command']

    Runalyze\Bundle\CoreBundle\Command\InstallDatabaseCommand:
        arguments:
            $parameterBag: '@parameter_bag'
            $doctrine: '@doctrine'
        tags: ['console.command']

    Runalyze\Bundle\CoreBundle\Command\InstallFilesystemCommand:
        arguments:
            $filesystem: '@filesystem'
            $kernel: '@kernel'
        tags: ['console.command']

    Runalyze\Bundle\CoreBundle\Component\Tool\Backup\FinderFactory: ~
    Runalyze\Bundle\CoreBundle\Component\Tool\Backup\FinderFactoryInterface: '@Runalyze\Bundle\CoreBundle\Component\Tool\Backup\FinderFactory'

    Runalyze\Migrations\:
        resource: '../migrations/*'
        bind:
            $DatabasePrefix: '%app.database_prefix%'

    Doctrine\ORM\EntityManager:
      alias: doctrine.orm.default_entity_manager
      public: false

    app.value_resolver.account:
      class: Runalyze\Bundle\CoreBundle\ArgumentResolver\AccountValueResolver
      tags:
        - { name: controller.argument_value_resolver, priority: 150 }
    Runalyze\Bundle\CoreBundle\ArgumentResolver\AccountValueResolver: '@app.value_resolver.account'

    app.listener.console_exception:
      class: Runalyze\Bundle\CoreBundle\EventListener\ConsoleExceptionListener
      tags:
        - { name: kernel.event_listener, event: console.error, method: onConsoleError }
    Runalyze\Bundle\CoreBundle\EventListener\ConsoleExceptionListener: '@app.listener.console_exception'
#    app.listener.console_error_status:
#      class: Runalyze\Bundle\CoreBundle\EventListener\ConsoleErrorStatusListener
#      tags:
#        - { name: kernel.event_listener, event: console.terminate }
#    Runalyze\Bundle\CoreBundle\EventListener\ConsoleErrorStatusListener: '@app.listener.console_error_status'

    app.locale_listener:
      class: Runalyze\Bundle\CoreBundle\EventListener\LocaleListener
      arguments: ['%kernel.default_locale%']
      tags:
        - { name: kernel.event_subscriber }
    Runalyze\Bundle\CoreBundle\EventListener\LocaleListener: '@app.locale_listener'
    app.listener.user_timezone:
      class: Runalyze\Bundle\CoreBundle\EventListener\UserTimezoneListener
      arguments: ["@security.token_storage"]
      tags:
        - { name: kernel.event_listener, event: kernel.request, method: onKernelRequest }
    Runalyze\Bundle\CoreBundle\EventListener\UserTimezoneListener: '@app.listener.user_timezone'
    app.user_locale_listener:
      class: Runalyze\Bundle\CoreBundle\EventListener\UserLocaleListener
      arguments: ['@request_stack']
      tags:
        - { name: kernel.event_listener, event: security.interactive_login, method: onInteractiveLogin }
        - { name: kernel.event_listener, event: security.switch_user, method: onSwitchUser }
    Runalyze\Bundle\CoreBundle\EventListener\UserLocaleListener: '@app.user_locale_listener'
    app.account_last_action_listener:
      class: Runalyze\Bundle\CoreBundle\EventListener\AccountLastActionListener
      arguments: ['@security.token_storage']
      tags:
        - { name: kernel.event_listener, event: kernel.controller, method: onCoreController }
    Runalyze\Bundle\CoreBundle\EventListener\AccountLastActionListener: '@app.account_last_action_listener'
    app.listener.recalculation_tasks_performer_listener:
      class: Runalyze\Bundle\CoreBundle\EventListener\RecalculationTasksPerformerListener
      arguments: ["@app.recalculation_manager"]
      tags:
        - { name: kernel.event_listener, event: kernel.terminate, method: onTerminate }
    Runalyze\Bundle\CoreBundle\EventListener\RecalculationTasksPerformerListener: '@app.listener.recalculation_tasks_performer_listener'
    app.sha256salted_encoder:
      class: Runalyze\Bundle\CoreBundle\Services\Sha256SaltedEncoder
      public: true
    Runalyze\Bundle\CoreBundle\Services\Sha256SaltedEncoder: '@app.sha256salted_encoder'

    Runalyze\Bundle\CoreBundle\Services\UnsubscribeHashGenerator:
        arguments:
            $appSecret: '%app.secret%'

    app.event.doctrine.table_prefix_subscriber:
      class: Runalyze\Bundle\CoreBundle\EventListener\TablePrefixSubscriber
      arguments: ['%app.database_prefix%']
    Runalyze\Bundle\CoreBundle\EventListener\TablePrefixSubscriber: '@app.event.doctrine.table_prefix_subscriber'
    app.listener.maintenance:
      class: Runalyze\Bundle\CoreBundle\EventListener\MaintenanceListener
      arguments: ['@parameter_bag', '@kernel', '@twig']
      tags:
        - { name: kernel.event_listener, event: kernel.request, method: onKernelRequest }
    Runalyze\Bundle\CoreBundle\EventListener\MaintenanceListener: '@app.listener.maintenance'

    Runalyze\Bundle\CoreBundle\Services\AccountMailer:
        arguments:
            $mailer: '@mailer'
            $twig: '@twig'
            $translator: '@translator'
        calls:
            - [setFrom, ["%app.mail_sender%", "%app.mail_name%"]]

    app.legacy_cache:
      class: Runalyze\Bundle\CoreBundle\Services\LegacyCache
      arguments: ["%app.data_directory%"]
    Runalyze\Bundle\CoreBundle\Services\LegacyCache: '@app.legacy_cache'

    Runalyze\Bundle\CoreBundle\Tests\DataFixtures\ORM\LoadAccountData:
        arguments:
            $passwordHasher: '@security.user_password_hasher'
        tags: [doctrine.fixture.orm]

    Runalyze\Bundle\CoreBundle\Component\Account\Registration:
        arguments:
            $passwordHasher: '@security.user_password_hasher'

    Runalyze\Bundle\CoreBundle\Services\AccountChecker: ~

    app.repository.account:
      class: Runalyze\Bundle\CoreBundle\Repository\AccountRepository
      factory: ["@doctrine.orm.entity_manager", getRepository]
      arguments: [Runalyze\Bundle\CoreBundle\Entity\Account]
    Runalyze\Bundle\CoreBundle\Repository\AccountRepository: '@app.repository.account'
    app.repository.conf:
      class: Runalyze\Bundle\CoreBundle\Repository\ConfRepository
      factory: ["@doctrine.orm.entity_manager", getRepository]
      arguments: [Runalyze\Bundle\CoreBundle\Entity\Conf]
    Runalyze\Bundle\CoreBundle\Repository\ConfRepository: '@app.repository.conf'
    app.repository.equipment:
      class: Runalyze\Bundle\CoreBundle\Repository\EquipmentRepository
      factory: ["@doctrine.orm.entity_manager", getRepository]
      arguments: [Runalyze\Bundle\CoreBundle\Entity\Equipment]
    Runalyze\Bundle\CoreBundle\Repository\EquipmentRepository: '@app.repository.equipment'
    app.repository.equipment_type:
      class: Runalyze\Bundle\CoreBundle\Repository\EquipmentTypeRepository
      factory: ["@doctrine.orm.entity_manager", getRepository]
      arguments: [Runalyze\Bundle\CoreBundle\Entity\EquipmentType]
    Runalyze\Bundle\CoreBundle\Repository\EquipmentTypeRepository: '@app.repository.equipment_type'

    Runalyze\Bundle\CoreBundle\Repository\NotificationRepository:
        class: Runalyze\Bundle\CoreBundle\Repository\NotificationRepository
        factory: ['@doctrine.orm.entity_manager', 'getRepository']
        arguments: ['Runalyze\Bundle\CoreBundle\Entity\Notification']

    app.repository.race_result:
      class: Runalyze\Bundle\CoreBundle\Repository\RaceresultRepository
      factory: ["@doctrine.orm.entity_manager", getRepository]
      arguments: [Runalyze\Bundle\CoreBundle\Entity\Raceresult]
    Runalyze\Bundle\CoreBundle\Repository\RaceresultRepository: '@app.repository.race_result'
    app.repository.sport:
      class: Runalyze\Bundle\CoreBundle\Repository\SportRepository
      factory: ["@doctrine.orm.entity_manager", getRepository]
      arguments: [Runalyze\Bundle\CoreBundle\Entity\Sport]
    Runalyze\Bundle\CoreBundle\Repository\SportRepository: '@app.repository.sport'
    app.repository.tag:
      class: Runalyze\Bundle\CoreBundle\Repository\TagRepository
      factory: ["@doctrine.orm.entity_manager", getRepository]
      arguments: [Runalyze\Bundle\CoreBundle\Entity\Tag]
    Runalyze\Bundle\CoreBundle\Repository\TagRepository: '@app.repository.tag'
    app.repository.type:
      class: Runalyze\Bundle\CoreBundle\Repository\TypeRepository
      factory: ["@doctrine.orm.entity_manager", getRepository]
      arguments: [Runalyze\Bundle\CoreBundle\Entity\Type]
    Runalyze\Bundle\CoreBundle\Repository\TypeRepository: '@app.repository.type'
    app.repository.training:
      class: Runalyze\Bundle\CoreBundle\Repository\TrainingRepository
      factory: ["@doctrine.orm.entity_manager", getRepository]
      arguments: [Runalyze\Bundle\CoreBundle\Entity\Training]
    Runalyze\Bundle\CoreBundle\Repository\TrainingRepository: '@app.repository.training'

    Runalyze\Bundle\CoreBundle\Repository\UserRepository:
      class: Runalyze\Bundle\CoreBundle\Repository\UserRepository
      factory: ["@doctrine.orm.entity_manager", getRepository]
      arguments: [Runalyze\Bundle\CoreBundle\Entity\User]

    app.repository.weathercache:
      class: Runalyze\Bundle\CoreBundle\Repository\WeathercacheRepository
      factory: ["@doctrine.orm.entity_manager", getRepository]
      arguments: [Runalyze\Bundle\CoreBundle\Entity\Weathercache]
    Runalyze\Bundle\CoreBundle\Repository\WeathercacheRepository: '@app.repository.weathercache'
    app.entity_listener.activity:
      class: Runalyze\Bundle\CoreBundle\EntityListener\ActivityListener
      arguments: ["@app.recalculation_manager", "@app.configuration_manager", "@app.repository.sport", "@app.repository.equipment", "@app.timezone_lookup"]
      tags:
      - { name: doctrine.orm.entity_listener, lazy: true }
    Runalyze\Bundle\CoreBundle\EntityListener\ActivityListener: '@app.entity_listener.activity'
    app.entity_subscriber.equipment_update:
      class: Runalyze\Bundle\CoreBundle\EntityListener\EquipmentUpdateSubscriber
      tags:
      - { name: doctrine.event_listener, event: onFlush, connection: default, lazy: true }
    Runalyze\Bundle\CoreBundle\EntityListener\EquipmentUpdateSubscriber: '@app.entity_subscriber.equipment_update'
    app.entity_listener.user:
      class: Runalyze\Bundle\CoreBundle\EntityListener\UserListener
      arguments:
        - '@app.configuration_updater'
        - '@Runalyze\Bundle\CoreBundle\Repository\UserRepository'
      tags:
        - { name: doctrine.orm.entity_listener, lazy: true }
    Runalyze\Bundle\CoreBundle\EntityListener\UserListener: '@app.entity_listener.user'
    app.entity_listener.race_result:
      class: Runalyze\Bundle\CoreBundle\EntityListener\RaceResultListener
      arguments: ["@app.recalculation_manager"]
      tags:
      - { name: doctrine.orm.entity_listener, lazy: true }
    Runalyze\Bundle\CoreBundle\EntityListener\RaceResultListener: '@app.entity_listener.race_result'
    app.entity_listener.route:
      class: Runalyze\Bundle\CoreBundle\EntityListener\RouteListener
      arguments: ["@app.configuration_manager", "@app.elevation_correction"]
      tags:
      - { name: doctrine.orm.entity_listener, lazy: true }
    Runalyze\Bundle\CoreBundle\EntityListener\RouteListener: '@app.entity_listener.route'
    app.form.activity:
      class: Runalyze\Bundle\CoreBundle\Form\ActivityType
      arguments: ["@security.token_storage", "@app.repository.tag"]
      tags:
      - { name: form.type }
    Runalyze\Bundle\CoreBundle\Form\ActivityType: '@app.form.activity'
    app.form.multi_importer:
      class: Runalyze\Bundle\CoreBundle\Form\MultiImporterType
      tags:
      - { name: form.type }
    Runalyze\Bundle\CoreBundle\Form\MultiImporterType: '@app.form.multi_importer'
    app.form.activity.equipment:
      class: Runalyze\Bundle\CoreBundle\Form\Type\ActivityEquipmentType
      arguments: ["@security.token_storage"]
      calls:
      - [setConfigurationManager, ["@app.configuration_manager"]]
      tags:
      - { name: form.type }
    Runalyze\Bundle\CoreBundle\Form\Type\ActivityEquipmentType: '@app.form.activity.equipment'
    app.form.anova:
      class: Runalyze\Bundle\CoreBundle\Form\Tools\Anova\AnovaType
      arguments: ["@app.repository.sport", "@app.repository.type", "@app.repository.equipment_type", "@security.token_storage", "@app.configuration_manager"]
      tags:
      - { name: form.type }
    Runalyze\Bundle\CoreBundle\Form\Tools\Anova\AnovaType: '@app.form.anova'
    app.form.trend_analysis:
      class: Runalyze\Bundle\CoreBundle\Form\Tools\TrendAnalysis\TrendAnalysisType
      arguments: ["@app.repository.sport", "@app.repository.type", "@security.token_storage", "@app.configuration_manager"]
      tags:
      - { name: form.type }
    Runalyze\Bundle\CoreBundle\Form\Tools\TrendAnalysis\TrendAnalysisType: '@app.form.trend_analysis'
    app.form.poster:
      class: Runalyze\Bundle\CoreBundle\Form\Tools\PosterType
      arguments: ["@app.repository.sport", "@app.repository.training", "@security.token_storage"]
      tags:
      - { name: form.type }
    Runalyze\Bundle\CoreBundle\Form\Tools\PosterType: '@app.form.poster'
    app.form.equipment:
      class: Runalyze\Bundle\CoreBundle\Form\EquipmentType
      arguments: ["@app.repository.equipment_type", "@security.token_storage"]
      tags:
      - { name: form.type }
    Runalyze\Bundle\CoreBundle\Form\EquipmentType: '@app.form.equipment'
    app.form.equipment_category:
      class: Runalyze\Bundle\CoreBundle\Form\EquipmentCategoryType
      arguments: ["@app.repository.sport", "@security.token_storage"]
      tags:
      - { name: form.type }
    Runalyze\Bundle\CoreBundle\Form\EquipmentCategoryType: '@app.form.equipment_category'
    app.form.sport_setting:
      class: Runalyze\Bundle\CoreBundle\Form\Settings\SportType
      arguments: ["@app.repository.type", "@app.repository.sport", "@app.repository.equipment_type", "@security.token_storage"]
      tags:
      - { name: form.type }
    Runalyze\Bundle\CoreBundle\Form\Settings\SportType: '@app.form.sport_setting'
    app.form.sport_types_setting:
      class: Runalyze\Bundle\CoreBundle\Form\Settings\SportTypeType
      arguments: ["@security.token_storage"]
      tags:
      - { name: form.type }
    Runalyze\Bundle\CoreBundle\Form\Settings\SportTypeType: '@app.form.sport_types_setting'
    app.form.race_result:
      class: Runalyze\Bundle\CoreBundle\Form\RaceResultType
      tags:
      - { name: form.type }
    Runalyze\Bundle\CoreBundle\Form\RaceResultType: '@app.form.race_result'
    app.form.type.body_values:
      class: Runalyze\Bundle\CoreBundle\Form\BodyValuesType
      tags:
      - { name: form.type }
    Runalyze\Bundle\CoreBundle\Form\BodyValuesType: '@app.form.type.body_values'
    app.form.type.distance:
      class: Runalyze\Bundle\CoreBundle\Form\Type\DistanceType
      arguments: ["@app.unit_system.distance"]
      tags:
      - { name: form.type }
    Runalyze\Bundle\CoreBundle\Form\Type\DistanceType: '@app.form.type.distance'
    app.form.type.elevation:
      class: Runalyze\Bundle\CoreBundle\Form\Type\ElevationType
      arguments: ["@app.unit_system.elevation"]
      tags:
      - { name: form.type }
    Runalyze\Bundle\CoreBundle\Form\Type\ElevationType: '@app.form.type.elevation'
    app.form.type.energy:
      class: Runalyze\Bundle\CoreBundle\Form\Type\EnergyType
      arguments: ["@app.unit_system.energy"]
      tags:
      - { name: form.type }
    Runalyze\Bundle\CoreBundle\Form\Type\EnergyType: '@app.form.type.energy'
    app.form.type.energy_kcal:
      class: Runalyze\Bundle\CoreBundle\Form\Type\EnergyKcalType
      tags:
      - { name: form.type }
    Runalyze\Bundle\CoreBundle\Form\Type\EnergyKcalType: '@app.form.type.energy_kcal'
    app.form.type.power:
      class: Runalyze\Bundle\CoreBundle\Form\Type\PowerType
      tags:
      - { name: form.type }
    Runalyze\Bundle\CoreBundle\Form\Type\PowerType: '@app.form.type.power'
    app.form.type.sport:
      class: Runalyze\Bundle\CoreBundle\Form\Type\SportChoiceType
      arguments: ["@security.token_storage", "@app.repository.sport"]
      calls:
      - [setConfigurationManager, ["@app.configuration_manager"]]
      tags:
      - { name: form.type }
    Runalyze\Bundle\CoreBundle\Form\Type\SportChoiceType: '@app.form.type.sport'
    app.form.type.activity_type:
      class: Runalyze\Bundle\CoreBundle\Form\Type\ActivityTypeChoiceType
      arguments: ["@security.token_storage"]
      calls:
      - [setConfigurationManager, ["@app.configuration_manager"]]
      tags:
      - { name: form.type }
    Runalyze\Bundle\CoreBundle\Form\Type\ActivityTypeChoiceType: '@app.form.type.activity_type'
    app.form.type.activity_lapintensity:
      class: Runalyze\Bundle\CoreBundle\Form\Type\ActivityLapIntensityChoiceType
      arguments: ["@security.token_storage"]
      calls:
      - [setConfigurationManager, ["@app.configuration_manager"]]
      tags:
      - { name: form.type }
    Runalyze\Bundle\CoreBundle\Form\Type\ActivityLapIntensityChoiceType: '@app.form.type.activity_lapintensity'
    app.form.type.temperature:
      class: Runalyze\Bundle\CoreBundle\Form\Type\TemperatureType
      arguments: ["@app.unit_system.temperature"]
      tags:
      - { name: form.type }
    Runalyze\Bundle\CoreBundle\Form\Type\TemperatureType: '@app.form.type.temperature'
    app.form.type.wind_speed:
      class: Runalyze\Bundle\CoreBundle\Form\Type\WindSpeedType
      arguments: ["@app.unit_system.wind_speed"]
      tags:
      - { name: form.type }
    Runalyze\Bundle\CoreBundle\Form\Type\WindSpeedType: '@app.form.type.wind_speed'
    app.form.type.weight:
      class: Runalyze\Bundle\CoreBundle\Form\Type\WeightType
      arguments: ["@app.unit_system.weight"]
      tags:
      - { name: form.type }
    Runalyze\Bundle\CoreBundle\Form\Type\WeightType: '@app.form.type.weight'
    app.form.type.hrzonebound:
      class: Runalyze\Bundle\CoreBundle\Form\Type\HrZoneBoundType
      arguments: []
      tags:
      - { name: form.type }
    Runalyze\Bundle\CoreBundle\Form\Type\HrZoneBoundType: '@app.form.type.hrzonebound'

    app.automatic_reload_flag_setter:
      class: Runalyze\Bundle\CoreBundle\Services\AutomaticReloadFlagSetter
      arguments: ["@request_stack"]
    Runalyze\Bundle\CoreBundle\Services\AutomaticReloadFlagSetter: '@app.automatic_reload_flag_setter'

    app.privacy_guard:
      class: Runalyze\Bundle\CoreBundle\Services\PrivacyGuard
      arguments: ["@security.token_storage", "@app.configuration_manager"]
    Runalyze\Bundle\CoreBundle\Services\PrivacyGuard: '@app.privacy_guard'
    Runalyze\Bundle\CoreBundle\Services\Activity\ActivityContextFactory:
      arguments: ["@doctrine.orm.entity_manager"]
    app.activity_context.factory:
      alias: Runalyze\Bundle\CoreBundle\Services\Activity\ActivityContextFactory
    Runalyze\Bundle\CoreBundle\Services\Configuration\ConfigurationManager:
      arguments: ["@app.repository.conf", "@security.token_storage"]
    app.configuration_manager:
      alias: Runalyze\Bundle\CoreBundle\Services\Configuration\ConfigurationManager

    app.configuration_updater:
      class: Runalyze\Bundle\CoreBundle\Services\Configuration\ConfigurationUpdater
      arguments: ["@app.repository.conf", "@app.configuration_manager"]
      lazy: true
    Runalyze\Bundle\CoreBundle\Services\Configuration\ConfigurationUpdater: '@app.configuration_updater'

    app.recalculation_manager:
      class: Runalyze\Bundle\CoreBundle\Services\Recalculation\RecalculationManager
      arguments: ["@app.configuration_manager", "@app.configuration_updater", "@app.repository.training", "@app.repository.race_result"]
      lazy: true
    Runalyze\Bundle\CoreBundle\Services\Recalculation\RecalculationManager: '@app.recalculation_manager'
    app.sport_selection_factory:
      class: Runalyze\Bundle\CoreBundle\Services\Selection\SportSelectionFactory
      arguments: ["@app.repository.sport", "@app.configuration_manager", "@security.token_storage"]
    Runalyze\Bundle\CoreBundle\Services\Selection\SportSelectionFactory: '@app.sport_selection_factory'

    app.unit_system_factory:
      class: Runalyze\Bundle\CoreBundle\Services\UnitSystemFactory
    Runalyze\Bundle\CoreBundle\Services\UnitSystemFactory: '@app.unit_system_factory'
    app.unit_system.distance:
      class: Runalyze\Metrics\Distance\Unit\AbstractDistanceUnit
      factory: ["@app.unit_system_factory", "getDistanceUnit"]
      arguments: ["@app.configuration_manager"]
    app.unit_system.elevation:
      class: Runalyze\Metrics\Distance\Unit\AbstractDistanceUnit
      factory: ["@app.unit_system_factory", "getElevationUnit"]
      arguments: ["@app.configuration_manager"]
    Runalyze\Metrics\Distance\Unit\AbstractDistanceUnit: '@app.unit_system.elevation'

