security:
    enable_authenticator_manager: true
    password_hashers:
        Runalyze\Bundle\CoreBundle\Entity\Account:
            id: app.sha256salted_encoder
    providers:
        users_in_memory: { memory: null }
        runalyzeuser:
            entity:
                class: Runalyze\Bundle\CoreBundle\Entity\Account
    firewalls:
        default:
            entry_point: form_login
            http_basic: ~
            provider: runalyzeuser
            switch_user: { role: ROLE_ADMIN, parameter: _switch_user }
            user_checker: Runalyze\Bundle\CoreBundle\Services\AccountChecker
            logout:
                path: /logout
                target: /
            stateless: false
            form_login:
                login_path: login
                check_path: login_check
                enable_csrf: true
                use_referer: true
            remember_me:
                secret: '%app.secret%'
                lifetime: 604800
                path: /
        externalapi:
            pattern:  ^/api
            http_basic: true
            provider:  runalyzeuser
            stateless: true
            user_checker: Runalyze\Bundle\CoreBundle\Services\AccountChecker
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        setup:
            pattern: ^/(update|install)
            security: false
    role_hierarchy:
        ROLE_ADMIN: ROLE_USER
    # Easy way to control access for large sections of your site
    # Note: Only the *first* access control that matches will be used
    access_control:
        # - { path: ^/admin, roles: ROLE_ADMIN }
        # - { path: ^/profile, roles: ROLE_USER }
