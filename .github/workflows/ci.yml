name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PHP_VERSION: '8.5.13'
  COVERAGE_CACHE_PREFIX: coverage-main-xdebug-

jobs:
  qa:
    name: Static analysis & code style
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate development Compose configuration
        run: |
          docker compose config --quiet
          docker compose --profile garmin config --quiet

      - name: Test database setup safeguards
        run: |
          bash -n docker/setup-test-db.sh docker/runalyze-entrypoint.sh
          bash tests/shell/setup-test-db-test.sh

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ctype, iconv, pdo_mysql, pdo_sqlite, sqlite3
          coverage: none

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v4

      - name: Rector (dry-run)
        run: composer rector

      - name: EasyCodingStandard
        run: composer lint

      - name: PHPStan
        run: composer analyse

      - name: TwigCS
        run: composer twig:lint

  tests:
    name: PHPUnit (PHP ${{ matrix.php-version }})
    needs: qa
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      coverage_report: ${{ steps.coverage.outputs.report }}
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.5.13']
    services:
      mariadb:
        image: mariadb:12.3
        env:
          MYSQL_ROOT_PASSWORD: root
          TZ: Europe/Berlin
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=30
      redis:
        image: redis:6.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    env:
      TZ: Europe/Berlin
      TEST_TIMEZONE: Europe/Berlin
      DATABASE_PREFIX: runalyze_
      DB_TEST_HOST: 127.0.0.1
      DB_TEST_PORT: '3306'
      DB_TEST_USER: root
      DB_TEST_PASSWORD: root
      DB_UNITTEST_NAME: runalyze_unittest
      DB_TEST_EMPTY_NAME: runalyze_test_empty
      TEST_SQLITE_PATH: /dev/shm/runalyze-test.db
      SQLITE_MOD_SPATIALITE: mod_spatialite.so
      REDIS_URL: redis://127.0.0.1
      MAILER_DSN: null://null
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: ctype, iconv, pdo_mysql, pdo_sqlite, sqlite3
          coverage: xdebug

      - name: Install system dependencies
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends mariadb-client libsqlite3-mod-spatialite

      - name: Resolve spatialite module path
        run: |
          MODULE_PATH="$(dpkg -L libsqlite3-mod-spatialite | grep -m1 'mod_spatialite.so$' || true)"
          if [ -n "$MODULE_PATH" ]; then
            echo "SQLITE_MOD_SPATIALITE=$MODULE_PATH" >> "$GITHUB_ENV"
          fi

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v4

      - name: Download test data
        run: |
          composer download:timezone-database
          composer download:disposable-domains-list
          composer download:tif-testfiles || true

      - name: Prepare test databases
        run: composer test:setup

      - name: Run PHPUnit with coverage
        run: |
          mkdir -p var/log var/coverage
          composer test:coverage-clover

      - name: Save main branch coverage baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p coverage-baseline/var/coverage
          cp var/coverage/clover.xml coverage-baseline/var/coverage/clover.xml

      - name: Store main branch coverage baseline in cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: coverage-baseline/var/coverage/clover.xml
          key: ${{ env.COVERAGE_CACHE_PREFIX }}${{ github.sha }}

      - name: Detect PHPUnit coverage scope changes
        if: github.event_name == 'pull_request'
        id: coverage-scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git show "$BASE_SHA:phpunit.xml.dist" > "$RUNNER_TEMP/base-phpunit.xml.dist"
          if cmp -s phpunit.xml.dist "$RUNNER_TEMP/base-phpunit.xml.dist"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "PHPUnit configuration changed; recalculating base coverage with the PR's configuration."
          fi

      - name: Restore base branch coverage
        if: github.event_name == 'pull_request' && steps.coverage-scope.outputs.changed == 'false'
        id: baseline-cache
        uses: actions/cache/restore@v6
        with:
          path: coverage-baseline/var/coverage/clover.xml
          key: ${{ env.COVERAGE_CACHE_PREFIX }}${{ github.event.pull_request.base.sha }}

      - name: Checkout pull request base revision
        if: >-
          github.event_name == 'pull_request' &&
          (steps.coverage-scope.outputs.changed == 'true' || steps.baseline-cache.outputs.cache-hit != 'true')
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: coverage-baseline
          fetch-depth: 1

      - name: Apply PR coverage configuration to base revision
        if: github.event_name == 'pull_request' && steps.coverage-scope.outputs.changed == 'true'
        run: cp phpunit.xml.dist coverage-baseline/phpunit.xml.dist

      - name: Measure base branch coverage
        if: >-
          github.event_name == 'pull_request' &&
          (steps.coverage-scope.outputs.changed == 'true' || steps.baseline-cache.outputs.cache-hit != 'true')
        working-directory: coverage-baseline
        run: |
          composer install --no-interaction --prefer-dist --no-progress --no-scripts
          composer download:timezone-database
          composer download:disposable-domains-list
          composer download:tif-testfiles || true
          composer test:setup
          mkdir -p var/log var/coverage
          composer test:coverage-clover

      - name: Compare code coverage
        if: github.event_name == 'pull_request'
        id: coverage
        env:
          BASELINE_COVERAGE: coverage-baseline/var/coverage/clover.xml
          PULL_REQUEST_COVERAGE: var/coverage/clover.xml
        run: php .github/scripts/compare-coverage.php

      - name: Upload PHPUnit results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phpunit-junit-${{ matrix.php-version }}
          path: var/log/phpunit-junit.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phpunit-coverage-${{ matrix.php-version }}
          path: |
            var/coverage/clover.xml
            coverage-baseline/var/coverage/clover.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Enforce coverage gate
        if: github.event_name == 'pull_request'
        env:
          COVERAGE_FAILED: ${{ steps.coverage.outputs.failed }}
        run: |
          echo "Coverage gate input: '$COVERAGE_FAILED'"
          if [ "$COVERAGE_FAILED" != "false" ]; then
            echo "::error::Statement coverage decreased or could not be determined."
            exit 1
          fi

  coverage-comment:
    name: Publish coverage report
    needs: tests
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.tests.outputs.coverage_report != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Create or update coverage comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COVERAGE_REPORT: ${{ needs.tests.outputs.coverage_report }}
        run: |
          comment_id="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.body | contains("<!-- runalyze-coverage-report -->")) | .id' | head -n 1)"

          if [ -n "$comment_id" ]; then
            gh api "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" \
              --method PATCH --field body="$COVERAGE_REPORT"
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
              --method POST --field body="$COVERAGE_REPORT"
          fi
