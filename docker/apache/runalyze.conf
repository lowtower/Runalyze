ServerName localhost

<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html/web

    <Directory /var/www/html/web>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
        FallbackResource /app_dev.php
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/runalyze_error.log
    CustomLog ${APACHE_LOG_DIR}/runalyze_access.log combined
</VirtualHost>
