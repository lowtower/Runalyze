doctrine:
    dbal:
        default_connection: default
        connections:
            default:
                driver: pdo_sqlite
                path: '%kernel.cache_dir%/test.db'
#            functional:
#                driver:   pdo_mysql
#                host:     '%env(DB_TEST_HOST)%'
#                port:     '%env(int:DB_TEST_PORT)%'
#                dbname:   '%env(DB_TEST_NAME)%'
#                user:     '%env(DB_TEST_USER)%'
#                password: '%env(DB_TEST_PASSWORD)%'
#                charset:  UTF8
#                options: {1002: "SET time_zone = '+00:00'"}
            unittest:
                driver:   pdo_mysql
                host:     '%env(DB_TEST_HOST)%'
                port:     '%env(int:DB_TEST_PORT)%'
                dbname:   '%env(DB_UNITTEST_NAME)%'
                user:     '%env(DB_TEST_USER)%'
                password: '%env(DB_TEST_PASSWORD)%'
                charset:  UTF8
                options: {1002: "SET time_zone = '+00:00'"}

parameters:
    database_prefix: 'runalyze_test_'
    database_prefix.functional: 'runalyze_test_'
    database_prefix.unittest: 'runalyze_'

services:
    _defaults:
        tags: ['doctrine.fixture.orm']
    Runalyze\Bundle\CoreBundle\Tests\DataFixtures\ORM\:
        resource: '../../../tests/CoreBundle/DataFixtures/ORM/*'
