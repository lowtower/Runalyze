services:
  db:
    image: docker.io/library/mariadb:10.1
    container_name: runalyze43-db
    environment:
      MYSQL_DATABASE: ${DB_NAME:-runalyze}
      MYSQL_USER: ${DB_USER:-runalyze}
      MYSQL_PASSWORD: ${DB_PASSWORD:-runalyze}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      TZ: ${TZ:-Europe/Berlin}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --sql-mode=TRADITIONAL
      - --innodb-file-format=Barracuda
      - --innodb-file-per-table=1
      - --innodb-large-prefix=1
      - --wait-timeout=36000
      - --max-allowed-packet=134217728
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - db-data:/var/lib/mysql
      - ./docker/mysql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  redis:
    image: docker.io/library/redis:5-alpine
    container_name: runalyze43-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  mailhog:
    image: docker.io/mailhog/mailhog:v1.0.1
    container_name: runalyze43-mailhog
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_UI_PORT:-8025}:8025"
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: runalyze43-app
    environment:
      LANG: C.UTF-8
      LANGUAGE: C.UTF-8
      LC_ALL: C.UTF-8
      APP_ENV: dev
      SYMFONY_ENV: dev
      TZ: ${TZ:-Europe/Berlin}
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-runalyze}
      DB_USER: ${DB_USER:-runalyze}
      DB_PASSWORD: ${DB_PASSWORD:-runalyze}
      DB_ROOT_USER: root
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      DB_TEST_NAME: ${DB_TEST_NAME:-runalyze_test}
      DB_TEST_USER: ${DB_TEST_USER:-runalyze_test}
      DB_TEST_PASSWORD: ${DB_TEST_PASSWORD:-password}
      DB_UNITTEST_NAME: ${DB_UNITTEST_NAME:-runalyze_unittest}
      SQLITE_MOD_SPATIALITE: mod_spatialite.so
      MAILER_HOST: mailhog
      MAILER_PORT: 1025
      TEST_TIMEZONE: Europe/Berlin
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html
      - composer-cache:/tmp/composer/cache
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  phpmyadmin:
    image: docker.io/phpmyadmin/phpmyadmin:5.2
    container_name: runalyze43-phpmyadmin
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: runalyze
      PMA_PASSWORD: runalyze
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PMA_UI_PORT:-8081}:80"

  frontend:
    image: docker.io/library/node:8
    container_name: runalyze43-frontend
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - node-modules:/var/www/html/node_modules
      - bower-components:/var/www/html/web/vendor
    command: ["bash", "-lc", "npm install --ignore-scripts && ./node_modules/.bin/bower install --allow-root && ./node_modules/.bin/gulp build"]

volumes:
  db-data:
  redis-data:
  composer-cache:
  node-modules:
  bower-components:
