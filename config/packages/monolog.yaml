monolog:
    channels: # To see all channels, run bin/console debug:autowiring logger
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists
        - queue
        - console
        - external_services
        - activity_uploads
    handlers:
        applog:
            type: rotating_file
            path: '%kernel.project_dir%/var/log/symfony.log'
            level: error
            max_files: 7
        main:
            type: fingers_crossed
            action_level: warning
            handler: file
        file:
            type: stream
            level: debug
        syslog:
            type: syslog
            level: error
        queue_file:
            type: rotating_file
            level: debug
            path: '%kernel.project_dir%/var/log/queue.log'
            max_files: 7
            channels: ['queue']
        console_file:
            type: rotating_file
            level: error
            path: '%kernel.project_dir%/var/log/console.log'
            max_files: 7
            channels: ['console']
        external_services_file:
            type: rotating_file
            level: warning
            path: '%kernel.project_dir%/var/log/external_services.log'
            max_files: 7
            channels: ['external_services']
        activity_uploads_file:
            type: rotating_file
            level: debug
            path: '%kernel.project_dir%/var/log/activity_uploads.log'
            max_files: 7
            channels: ['activity_uploads']

when@prod:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!deprecation"]
                buffer_size: 50 # How many messages should be saved? Prevent memory leaks
            nested:
                type: stream
                path: php://stderr
                level: debug
                formatter: monolog.formatter.json
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine"]
            deprecation:
                type: stream
                channels: [deprecation]
                path: php://stderr
                formatter: monolog.formatter.json

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                channels: ["!event"]
                # uncomment to get logging in your browser
                # you may have to allow bigger header sizes in your Web server configuration
                #firephp:
                #    type: firephp
                #    level: info
                #chromephp:
                #    type: chromephp
                #    level: info
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
