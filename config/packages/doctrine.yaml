doctrine:
    dbal:
        default_connection: default
        connections:
            default:
                driver:   pdo_mysql
                host:     '%env(DATABASE_HOST)%'
                port:     '%env(int:DATABASE_PORT)%'
                dbname:   '%env(DATABASE_NAME)%'
                user:     '%env(DATABASE_USER)%'
                password: '%env(DATABASE_PASSWORD)%'
                server_version: '%env(DATABASE_SERVER_VERSION)%'
                charset:  UTF8
                mapping_types:
                    enum: string
                use_savepoints: true
        types:
            casted_decimal_1: Runalyze\Bundle\CoreBundle\Doctrine\Types\CastedDecimalScale1Type
            casted_decimal_2: Runalyze\Bundle\CoreBundle\Doctrine\Types\CastedDecimalScale2Type
            tinyint: Runalyze\Bundle\CoreBundle\Doctrine\Types\TinyIntType
            pipe_array: Runalyze\Bundle\CoreBundle\Doctrine\Types\PipeDelimitedArray
            pipe_array_str: Runalyze\Bundle\CoreBundle\Doctrine\Types\PipeDelimitedArrayString
            geohash_array: Runalyze\Bundle\CoreBundle\Doctrine\Types\GeohashArray
            runalyze_pause_array: Runalyze\Bundle\CoreBundle\Doctrine\Types\RunalyzePauseArray
            runalyze_round_array: Runalyze\Bundle\CoreBundle\Doctrine\Types\RunalyzeRoundArray

    orm:
        enable_lazy_ghost_objects: true
        report_fields_where_declared: true
        auto_generate_proxy_classes: '%kernel.debug%'
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        auto_mapping: false
        mappings:
            CoreBundle:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/CoreBundle/Entity'
                prefix: 'Runalyze\Bundle\CoreBundle\Entity'
                alias: CoreBundle
        resolve_target_entities: ~
        metadata_cache_driver:
            type: pool
            pool: doctrine.system_cache_pool
        query_cache_driver:
            type: pool
            pool: doctrine.system_cache_pool
        result_cache_driver:
            type: pool
            pool: doctrine.result_cache_pool
        hydrators:
            COLUMN_HYDRATOR: Runalyze\Bundle\CoreBundle\Doctrine\Hydrator\ColumnHydrator
        dql:
            datetime_functions:
                from_unixtime: DoctrineExtensions\Query\Mysql\FromUnixtime
                month: DoctrineExtensions\Query\Mysql\Month
                week: DoctrineExtensions\Query\Mysql\Week
                year: DoctrineExtensions\Query\Mysql\Year
            numeric_functions:
                round: DoctrineExtensions\Query\Mysql\Round

framework:
    cache:
        pools:
            doctrine.result_cache_pool:
                adapter: cache.app
            doctrine.system_cache_pool:
                adapter: cache.system

when@prod:
    doctrine:
        dbal:
            default_connection: default
            connections:
                default:
                    driver:   pdo_mysql
                    host:     '%env(DATABASE_HOST)%'
                    port:     '%env(int:DATABASE_PORT)%'
                    dbname:   '%env(DATABASE_NAME)%'
                    user:     '%env(DATABASE_USER)%'
                    password: '%env(DATABASE_PASSWORD)%'
                    server_version: '%env(DATABASE_SERVER_VERSION)%'
                    charset:  UTF8
                    options: {1002: "SET time_zone = '+00:00'"}
                    mapping_types:
                        enum: string
                    use_savepoints: true
        orm:
            auto_generate_proxy_classes: false
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system

when@dev:

when@test:
    doctrine:
        dbal:
            default_connection: default
            connections:
                default:
                    driver: pdo_sqlite
                    path: '%env(resolve:TEST_SQLITE_PATH)%'
#                functional:
#                    driver:   pdo_mysql
#                    host:     '%env(DB_TEST_HOST)%'
#                    port:     '%env(int:DB_TEST_PORT)%'
#                    dbname:   '%env(DB_TEST_NAME)%'
#                    user:     '%env(DB_TEST_USER)%'
#                    password: '%env(DB_TEST_PASSWORD)%'
#                    charset:  UTF8
#                    options: {1002: "SET time_zone = '+00:00'"}
                unittest:
                    driver:   pdo_mysql
                    host:     '%env(DB_TEST_HOST)%'
                    port:     '%env(int:DB_TEST_PORT)%'
                    dbname:   '%env(DB_UNITTEST_NAME)%'
                    user:     '%env(DB_TEST_USER)%'
                    password: '%env(DB_TEST_PASSWORD)%'
                    charset:  UTF8
                    options: {1002: "SET time_zone = '+00:00'"}
        orm:
            dql:
                datetime_functions:
                    from_unixtime: Runalyze\Bundle\CoreBundle\Tests\Doctrine\DQL\Sqlite\SqliteFromUnixtime
                    year: Runalyze\Bundle\CoreBundle\Tests\Doctrine\DQL\Sqlite\SqliteYear
                    month: Runalyze\Bundle\CoreBundle\Tests\Doctrine\DQL\Sqlite\SqliteMonth

    parameters:
        # SQLite file of the kernel tests. Without TEST_SQLITE_PATH it stays in the cache directory.
        env(TEST_SQLITE_PATH): '%kernel.cache_dir%/test.db'
        database_prefix: 'runalyze_test_'
        database_prefix.functional: 'runalyze_test_'
        database_prefix.unittest: 'runalyze_'

    services:
        _defaults:
            tags: ['doctrine.fixture.orm']
        Runalyze\Bundle\CoreBundle\Tests\DataFixtures\ORM\:
            resource: '%kernel.project_dir%/tests/CoreBundle/DataFixtures/ORM/*'

when@test_empty:
    doctrine:
        dbal:
            default_connection: default
            connections:
                default:
                    driver:   pdo_mysql
                    host:     '%env(DB_TEST_HOST)%'
                    port:     '%env(int:DB_TEST_PORT)%'
                    dbname:   '%env(DB_TEST_EMPTY_NAME)%'
                    user:     '%env(DB_TEST_USER)%'
                    password: '%env(DB_TEST_PASSWORD)%'
                    charset:  UTF8
                    options: {1002: "SET time_zone = '+00:00'"}

    parameters:
        env(DB_TEST_EMPTY_NAME): 'runalyze_test_empty'
        database_prefix: 'runalyze_'
