name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    name: Static analysis & code style
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5.12'
          extensions: ctype, iconv
          coverage: none

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v4

      - name: Rector (dry-run)
        run: composer rector

      - name: EasyCodingStandard
        run: composer lint

      - name: PHPStan
        run: composer analyse

      - name: TwigCS
        run: composer twig:lint

      - name: Dump run logs on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ci-logs
          gh run view "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --log > ci-logs/run.log || true

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: qa-logs
          path: ci-logs/
          if-no-files-found: ignore

  tests:
    name: PHPUnit (PHP ${{ matrix.php-version }})
    outputs:
      coverage_report: ${{ steps.coverage.outputs.report }}
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.5.12']
    services:
      mariadb:
        image: mariadb:12.3
        env:
          MYSQL_ROOT_PASSWORD: root
          TZ: Europe/Berlin
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=30
      redis:
        image: redis:6.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    env:
      TZ: Europe/Berlin
      TEST_TIMEZONE: Europe/Berlin
      DATABASE_PREFIX: runalyze_
      DB_TEST_HOST: 127.0.0.1
      DB_TEST_PORT: '3306'
      DB_TEST_USER: root
      DB_TEST_PASSWORD: root
      DB_UNITTEST_NAME: runalyze_unittest
      DB_TEST_EMPTY_NAME: runalyze_test_empty
      TEST_SQLITE_PATH: /dev/shm/runalyze-test.db
      SQLITE_MOD_SPATIALITE: mod_spatialite.so
      REDIS_URL: redis://127.0.0.1
      MAILER_DSN: null://null
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: ctype, iconv, pdo_mysql, pdo_sqlite, sqlite3
          coverage: xdebug

      - name: Install system dependencies (mariadb-client, spatialite)
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client libsqlite3-mod-spatialite

      - name: Resolve spatialite module path
        run: |
          MODULE_PATH="$(dpkg -L libsqlite3-mod-spatialite | grep -m1 'mod_spatialite.so$')"
          if [ -n "$MODULE_PATH" ]; then
            echo "SQLITE_MOD_SPATIALITE=$MODULE_PATH" >> "$GITHUB_ENV"
          fi

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v4

      - name: Download timezone database
        run: composer download:timezone-database

      - name: Download disposable domains list
        run: composer download:disposable-domains-list

      - name: Download TIF test files (optional)
        run: composer download:tif-testfiles
        continue-on-error: true

      - name: Prepare test databases
        run: composer test:setup

      - name: Run PHPUnit with coverage
        run: |
          mkdir -p var/log var/coverage
          composer test:coverage-clover

      - name: Prepare main branch coverage cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p coverage-baseline/var/coverage
          cp var/coverage/clover.xml coverage-baseline/var/coverage/clover.xml

      - name: Cache main branch coverage
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: coverage-baseline/var/coverage/clover.xml
          key: coverage-main-${{ github.sha }}

      - name: Restore base branch coverage
        if: github.event_name == 'pull_request'
        id: baseline-cache
        uses: actions/cache/restore@v4
        with:
          path: coverage-baseline/var/coverage/clover.xml
          key: coverage-main-${{ github.event.pull_request.base.sha }}

      - name: Checkout pull request base revision
        if: github.event_name == 'pull_request' && steps.baseline-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: coverage-baseline
          fetch-depth: 1

      - name: Install Composer dependencies for baseline
        if: github.event_name == 'pull_request' && steps.baseline-cache.outputs.cache-hit != 'true'
        run: composer install --working-dir=coverage-baseline --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Prepare baseline test data
        if: github.event_name == 'pull_request' && steps.baseline-cache.outputs.cache-hit != 'true'
        working-directory: coverage-baseline
        run: |
          composer download:timezone-database
          composer download:disposable-domains-list
          composer download:tif-testfiles || true
          composer test:setup

      - name: Measure base branch coverage
        if: github.event_name == 'pull_request' && steps.baseline-cache.outputs.cache-hit != 'true'
        working-directory: coverage-baseline
        run: |
          mkdir -p var/log var/coverage
          composer test:coverage-clover

      - name: Compare code coverage
        if: github.event_name == 'pull_request'
        id: coverage
        env:
          BASELINE_COVERAGE: coverage-baseline/var/coverage/clover.xml
          PULL_REQUEST_COVERAGE: var/coverage/clover.xml
        run: |
          php -r '
          $readCoverage = static function (string $path): array {
              if (!is_file($path)) {
                  fwrite(STDERR, "Coverage report not found: $path\n");
                  exit(1);
              }

              $report = simplexml_load_file($path);
              $metrics = $report?->project?->metrics;

              if ($metrics === null || !isset($metrics["statements"], $metrics["coveredstatements"])) {
                  fwrite(STDERR, "Coverage report has no statement metrics: $path\n");
                  exit(1);
              }

              $total = (int) $metrics["statements"];
              $covered = (int) $metrics["coveredstatements"];

              if ($total === 0) {
                  fwrite(STDERR, "Coverage report contains no executable statements: $path\n");
                  exit(1);
              }

              return [$covered, $total];
          };

          [$baseCovered, $baseTotal] = $readCoverage(getenv("BASELINE_COVERAGE"));
          [$headCovered, $headTotal] = $readCoverage(getenv("PULL_REQUEST_COVERAGE"));

          $basePercentage = 100 * $baseCovered / $baseTotal;
          $headPercentage = 100 * $headCovered / $headTotal;
          $coveredDelta = $headCovered - $baseCovered;
          $percentageDelta = $headPercentage - $basePercentage;
          $decreased = $coveredDelta < 0;
          $failed = $coveredDelta < 0;
          $change = sprintf("%+d covered statements (%+.4f pp)", $coveredDelta, $percentageDelta);
          $status = $decreased
              ? sprintf("Covered statements decreased by %d", -$coveredDelta)
              : "Covered statements did not decrease";

          $report = sprintf(
              "<!-- runalyze-coverage-report -->\n### Code coverage\n\n| Revision | Statement coverage | Covered statements |\n| --- | ---: | ---: |\n| Base branch | %.4f%% | %d/%d |\n| Pull request | %.4f%% | %d/%d |\n\n**Change:** %s  \n**Result:** %s",
              $basePercentage,
              $baseCovered,
              $baseTotal,
              $headPercentage,
              $headCovered,
              $headTotal,
              $change,
              $status
          ) . "\n\n**Gate:** the absolute number of covered statements must not decrease. Deleting untested code lowers the total, but not the covered count, and therefore does not fail the gate.";

          file_put_contents(getenv("GITHUB_STEP_SUMMARY"), $report . "\n");
          file_put_contents(
              getenv("GITHUB_OUTPUT"),
              "report<<COVERAGE_REPORT\n" . $report . "\nCOVERAGE_REPORT\n",
              FILE_APPEND
          );

          if ($failed) {
              fwrite(
                  STDERR,
                  sprintf(
                      "Covered statements decreased by %d (from %d to %d).\n",
                      -$coveredDelta,
                      $baseCovered,
                      $headCovered
                  )
              );
              exit(1);
          }

          echo "Covered statements did not decrease.\n";
          '
      - name: Dump run logs on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p var/log/ci
          gh run view "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --log > var/log/ci/run.log || true

      - name: Upload PHPUnit results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phpunit-junit-${{ matrix.php-version }}
          path: var/log/phpunit-junit.xml
          if-no-files-found: ignore

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phpunit-coverage-${{ matrix.php-version }}
          path: |
            var/coverage/clover.xml
            coverage-baseline/var/coverage/clover.xml
          if-no-files-found: ignore

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs
          path: var/log/ci/
          if-no-files-found: ignore

  coverage-comment:
    name: Publish coverage report
    needs: tests
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.tests.outputs.coverage_report != ''
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    steps:
      - name: Create or update coverage comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COVERAGE_REPORT: ${{ needs.tests.outputs.coverage_report }}
        run: |
          comments="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments")"
          comment_id="$(printf '%s' "$comments" | jq -r '.[][] | select(.body | contains("<!-- runalyze-coverage-report -->")) | .id' | head -n 1)"

          if [ -n "$comment_id" ]; then
            gh api "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" \
              --method PATCH \
              --field body="$COVERAGE_REPORT"
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
              --method POST \
              --field body="$COVERAGE_REPORT"
          fi
